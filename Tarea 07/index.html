<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Edad en Años de Tortuga</title>
    <link rel="stylesheet" href="resources/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>🐢 Calculadora de Edad de Tortuga</h1>
        <label for="turtleAge">Ingresa la edad de tu tortuga (en años):</label>
        <input type="number" id="turtleAge" min="0" placeholder="Ejemplo: 8">
        <br>
        <button id="calculateButton">Calcular Edad Humana</button>
        <p id="result"></p>
        <img src="resources/img/tortuga.jpg" alt="Imagen de tortuga" class="turtle-img">
    </div>
    <script src="resources/js/script.js"></script>
</body>
</html>
